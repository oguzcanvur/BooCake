    <style>
      html, body { margin: 0; height: 100%; background: #2e2230; overflow: hidden; }
      /* phones: use the visible height (no jump under the address bar), no page scroll or pull-to-refresh,
         no double-tap zoom or text selection while playing */
      body { height: 100dvh; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Phaser's Scale Manager (FIT + CENTER_BOTH) centers the canvas itself; no flex centering here. */
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      /* phones held upright: the game is wide, so ask to turn the phone (touch screens only; the game keeps running) */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; position: fixed; left: 0; right: 0; bottom: 6vh; justify-content: center; pointer-events: none; z-index: 10; }
        #rotate span { font: 600 18px Fredoka, system-ui, sans-serif; color: #fff1fa; background: rgba(46, 34, 48, 0.85); border: 2px solid #4a2a2e; border-radius: 999px; padding: 10px 18px; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span>&#x21bb; Turn your phone sideways to play bigger</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
